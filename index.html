<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Namecard</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="card">
        <div class="banner"></div>
        
        <div class="profile-section">
            <div class="profile-img">JD</div>
            <div class="name-section">
                <div class="name">Samantha Lee</div>
                <div class="title">Software Developer</div>
            </div>
        </div>
        
        <div class="card-body">
            <div class="info-item">
                <div class="icon">📧</div>
                <div class="info-text">
                    <div class="info-label">Email</div>
                    <div class="info-value"><a href="mailto:samantha@pollisum.com">samantha@pollisum.com</a></div>
                </div>
            </div>
            
            <div class="info-item">
                <div class="icon">📱</div>
                <div class="info-text">
                    <div class="info-label">Phone</div>
                    <div class="info-value"><a href="tel:+65 91377584">+65 91377584</a></div>
                </div>
            </div>
            
            <div class="info-item">
                <div class="icon">🌐</div>
                <div class="info-text">
                    <div class="info-label">Website</div>
                    <div class="info-value"><a href="https://wwww.pollisum.com" target="_blank">pollisum.com</a></div>
                </div>
            </div>
            
            <div class="info-item">
                <div class="icon">📍</div>
                <div class="info-text">
                    <div class="info-label">Location</div>
                    <div class="info-value">Singapore</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="download-btn" onclick="downloadVCard()">
                    <span>📥</span>
                    <span>Save Contact</span>
                </button>
            </div>
            
            <div class="social-links">
                <a href="#" class="social-btn" title="LinkedIn">💼</a>
                <a href="#" class="social-btn" title="GitHub">🐙</a>
                <a href="#" class="social-btn" title="Twitter">🐦</a>
            </div>
        </div>
    </div>

    <script src="vcard.js"></script>
</body>
</html>
